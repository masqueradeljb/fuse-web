<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE Fused Web</title>
  </head>
  <body>
    <video id="camera" playsinline muted></video>
    <canvas id="stage"></canvas>
    <div id="banner" hidden></div>
    <div id="fused-title" hidden aria-live="polite"><strong></strong><span></span></div>
    <div id="hint" hidden>Show both hands — pinch or make a fist to grab</div>
    <pre id="debug" hidden></pre>
    <section id="start">
      <canvas id="start-backdrop" aria-hidden="true"></canvas>
      <h1>THE Fused Web</h1>
      <div class="start-panel">
        <p>Paste your URL, then fuse it.</p>
        <form id="start-form" autocomplete="off">
          <input name="site" placeholder="yoursite.com" aria-label="Your site URL" spellcheck="false" autofocus />
          <button type="submit">Fuse</button>
        </form>
        <p id="start-status" class="status" aria-live="polite"></p>
      </div>
    </section>
    <form id="add-site" autocomplete="off" hidden>
      <input name="site" placeholder="+ add your site" spellcheck="false" />
      <span id="add-status" class="status"></span>
    </form>
    <div id="fused-overlay" hidden>
      <iframe title="Fused site"></iframe>
      <button type="button" aria-label="Close">×</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
